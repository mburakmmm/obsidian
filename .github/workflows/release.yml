name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate immutable release inputs
        shell: bash
        run: bash scripts/check-release.sh "${GITHUB_REF_NAME}"

      - name: Create draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.draft')"
            if [ "$draft" != "true" ]; then
              echo "release already exists and is not a draft" >&2
              exit 1
            fi
            echo "reusing existing draft release"
          else
            release_flags=(
              --verify-tag
              --draft
              --generate-notes
              --title "Obsidian $GITHUB_REF_NAME"
            )
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_flags[@]}"
          fi

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
