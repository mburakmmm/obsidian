name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate immutable release inputs
        shell: bash
        run: bash scripts/check-release.sh "${GITHUB_REF_NAME}"

      - name: Generate verified package SBOM
        shell: bash
        run: |
          set -euo pipefail
          stage=nox-lang-v2.2.70-linux-x64
          archive="$stage.tar.gz"
          gh release download v2.2.70 --repo mburakmmm/nox-lang --pattern "$archive" --dir "$RUNNER_TEMP"
          printf '%s  %s\n' 1920366b080bffaaf8dabef6ed4a37cd1ad4230c5b96a3b0241cba6850427b76 "$RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          NOXC="$RUNNER_TEMP/$stage/bin/noxc" bash scripts/generate-release-sbom.sh > "$RUNNER_TEMP/obsidian-${GITHUB_REF_NAME}.cdx.json"

      - name: Create draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.draft')"
            if [ "$draft" != "true" ]; then
              echo "release already exists and is not a draft" >&2
              exit 1
            fi
            echo "reusing existing draft release"
          else
            release_flags=(
              --verify-tag
              --draft
              --title "Obsidian $GITHUB_REF_NAME"
            )
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            notes="docs/releases/${GITHUB_REF_NAME#v}.md"
            if [[ -f "$notes" ]]; then
              release_flags+=(--notes-file "$notes")
            else
              release_flags+=(--generate-notes)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_flags[@]}"
          fi

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/obsidian-${GITHUB_REF_NAME}.cdx.json" --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
