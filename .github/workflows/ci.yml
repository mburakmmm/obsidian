name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NOX_REPOSITORY: mburakmmm/nox-lang

jobs:
  phase0:
    name: ${{ matrix.version == 'v2.1.0' && matrix.platform.asset || format('{0} (NOX {1})', matrix.platform.asset, matrix.version) }}
    env:
      NOX_VERSION: ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [v2.1.0, v2.2.38]
        platform:
          - os: macos-15
            asset: macos-arm64
            candidate_sha256: 7e973be6020fb908fed3d5194b87bff59ce5b4a0194cb81dee78fd7ff6abfcca
          - os: ubuntu-latest
            asset: linux-x64
            candidate_sha256: 66cc746dcd0640e596283f13b00758d9acb9ddf2761d89204105ff51b308c546
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            candidate_sha256: 12cc0dbb5edcacd2b7d618465d58a8f7f5301721e01c59f007670cb0c5a00982
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned NOX release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA256: ${{ matrix.platform.candidate_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          stage="nox-lang-${NOX_VERSION}-${{ matrix.platform.asset }}"
          archive="${stage}.tar.gz"
          checksum="${archive}.sha256"
          downloaded=false
          for attempt in 1 2 3; do
            rm -f "$archive" "$checksum"
            if gh release download "$NOX_VERSION" \
              --repo "$NOX_REPOSITORY" \
              --pattern "$archive" \
              --pattern "$checksum"; then
              downloaded=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 2))"
            fi
          done
          test "$downloaded" = true
          shasum -a 256 -c "${stage}.tar.gz.sha256"
          if [[ "$NOX_VERSION" == v2.2.38 ]]; then
            printf '%s  %s\n' "$CANDIDATE_SHA256" "$archive" | shasum -a 256 -c -
          fi
          tar xzf "${stage}.tar.gz"
          echo "$PWD/${stage}/bin" >>"$GITHUB_PATH"
          echo "NOX_RESOURCE_DIR=$PWD/${stage}" >>"$GITHUB_ENV"

      - name: Verify toolchain pin
        shell: bash
        run: |
          set -euo pipefail
          version_output="$(noxc --version 2>&1)"
          test "$version_output" = "noxc ${NOX_VERSION#v}"

      - name: Format check
        if: matrix.version == 'v2.2.38'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git ls-files '*.nox')"
          before="$(git ls-files -z '*.nox' | xargs -0 shasum)"
          while IFS= read -r -d '' source_file; do
            noxc fmt "$source_file"
          done < <(git ls-files -z '*.nox')
          after="$(git ls-files -z '*.nox' | xargs -0 shasum)"
          test "$before" = "$after"

      - name: Check and run LLVM
        shell: bash
        run: bash scripts/run-package-suite.sh llvm

      - name: Check and run QBE
        shell: bash
        run: bash scripts/run-package-suite.sh qbe

      - name: Negative compile fixture
        shell: bash
        run: |
          for fixture in tests/compile_fail/*.nox; do
            if noxc check "$fixture"; then
              echo "compile-fail fixture unexpectedly compiled: $fixture" >&2
              exit 1
            fi
          done

      - name: Audit async capabilities
        shell: bash
        run: bash scripts/run-async-capability-audit.sh

      - name: Check shared-spawn lint, path policy and nanosecond clock
        if: matrix.version == 'v2.2.38'
        shell: bash
        run: |
          OBSIDIAN_NOX22_PROBES=1 bash scripts/run-package-suite.sh llvm
          OBSIDIAN_NOX22_PROBES=1 bash scripts/run-package-suite.sh qbe

      - name: Verify deterministic package SBOM
        if: matrix.version == 'v2.2.38'
        shell: bash
        run: bash scripts/generate-release-sbom.sh > /dev/null

      - name: Verify dependency alias import
        shell: bash
        run: bash scripts/verify-package-import.sh

      - name: Audit dependency direction
        shell: bash
        run: bash scripts/audit-dependencies.sh

      - name: Verify optional ecosystem adapters
        shell: bash
        run: bash scripts/run-ecosystem-suite.sh all

      - name: Smoke benchmark harness (non-baseline)
        shell: bash
        run: |
          bash scripts/run-benchmarks.sh llvm
          bash scripts/run-benchmarks.sh qbe

      - name: Smoke file and rotation stress
        shell: bash
        run: |
          bash scripts/run-file-stress.sh llvm smoke
          bash scripts/run-file-stress.sh qbe smoke

      - name: Report test evidence
        shell: bash
        run: |
          set -euo pipefail
          test_files="$(find tests -name '*_test.nox' -type f | wc -l | tr -d ' ')"
          assertions="$(find tests -name '*_test.nox' -type f -print0 | xargs -0 grep -ho 'nox\.test\.assert_[a-z_]*' | wc -l | tr -d ' ')"
          capability_probes="$(find tests/capability -name 'async_*.nox' -type f | wc -l | tr -d ' ')"
          ecosystem_probes="$(find tests/ecosystem -name '*_probe.nox' -type f | wc -l | tr -d ' ')"
          ecosystem_checks="$(grep -RhoE '(nox\.test\.assert_[a-z_]*|capture\.assert_[a-z_]*)' tests/ecosystem | wc -l | tr -d ' ')"
          {
            echo "### Obsidian test evidence"
            echo "- test files: $test_files"
            echo "- assertions: $assertions"
            echo "- skips: 0"
            echo "- async capability probes: $capability_probes (no-go)"
            echo "- ecosystem probes: $ecosystem_probes ($ecosystem_checks explicit checks per backend)"
            echo "- benchmark harness: LLVM/QBE smoke only (not baseline evidence)"
            echo "- file/rotation stress: LLVM/QBE smoke, 8,000 events per path/backend"
            echo "- backends: LLVM, QBE"
          } >>"$GITHUB_STEP_SUMMARY"
